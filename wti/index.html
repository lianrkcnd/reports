<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WTI 期权工作台</title>
<style>
:root{--bg:#f5f7fa;--card:#ffffff;--card2:#f1f3f8;--border:#e1e4ea;--text:#1a1f2e;--muted:#6c7488;--accent:#d4890a;--red:#c0392b;--green:#2c7c4f;--blue:#2980b9;--purple:#7d3c98;--shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;padding-bottom:env(safe-area-inset-bottom)}
.container{max-width:1280px;margin:0 auto;position:relative}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.hdr h1{font-size:22px;color:var(--accent);white-space:nowrap}
.hdr-right{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn svg{width:14px;height:14px;fill:currentColor}

/* Date nav */
.date-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.date-tab{padding:5px 12px;border-radius:5px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer;transition:.15s}
.date-tab:hover{border-color:var(--accent);color:var(--text)}
.date-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

/* Contract filter bar */
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
.filter-label{font-size:13px;color:var(--muted);font-weight:500;margin-right:4px}
.filter-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;border:1.5px solid var(--border);background:var(--card2);font-size:12px;cursor:pointer;transition:all .15s;user-select:none}
.filter-chip:hover{border-color:var(--accent)}
.filter-chip input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer;margin:0}
.filter-chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.filter-chip.off{opacity:0.45;text-decoration:line-through}
.btn-mini{padding:5px 12px;font-size:12px;border-radius:5px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;transition:.15s}
.btn-mini:hover{border-color:var(--accent);color:var(--accent)}
.btn-mini.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.trend-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px}

/* Alert box */
.alert{background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;line-height:1.6}
.alert b{color:var(--red)}

/* Section */
.section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.section-title{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* Cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card2);border-radius:8px;padding:14px;border-left:4px solid var(--accent)}
.card .tenor{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
.card .row{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0;font-size:13px}
.card .row .label{color:var(--muted)}
.card .row .val{font-weight:600;font-size:14px}
.up{color:var(--red)}.down{color:var(--green)}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}
th{background:var(--card2);color:var(--accent);padding:6px 8px;text-align:center;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(212,137,10,0.06)}
tr:hover td:nth-child(1){font-weight:700;color:var(--accent)}

/* Chart area */
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.chart-box{background:var(--card2);border-radius:8px;padding:12px;position:relative}
.chart-box h3{font-size:13px;color:var(--accent);margin-bottom:8px}
.chart-box svg{width:100%;height:auto;display:block}

/* Monthly grouped charts */
.charts-grouped{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.month-group{background:var(--card2);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;background:var(--card);transition:.15s;border-bottom:1px solid var(--border)}
.month-header:hover{background:rgba(212,137,10,0.06)}
.month-header .title{font-size:14px;font-weight:700}
.month-header .hint{font-size:11px;color:var(--muted)}
.collapse-icon{display:inline-block;color:var(--accent);margin-right:6px;transition:transform .2s;font-size:11px;width:11px}
.collapse-icon.exp{transform:rotate(90deg)}
.month-body{padding:10px 12px 12px;display:none;border-top:1px solid var(--border)}
.month-body.exp{display:block}
.month-body.fixed{display:block;border-top:none}
.month-body.fixed:first-of-type{border-top:1px solid var(--border)}
.month-body .sub-title{font-size:13px;font-weight:700;margin-bottom:8px}

/* Sub-section collapsible (for OI table) */
.sub-section{margin-bottom:14px}
.sub-section-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;user-select:none;background:var(--card2);border:1px solid var(--border);border-radius:8px;transition:.15s}
.sub-section-header:hover{background:rgba(212,137,10,0.06)}
.sub-section-header .title{font-size:13px;font-weight:700;color:var(--accent)}
.sub-section-header .hint{font-size:11px;color:var(--muted)}
.sub-body{display:none;margin-top:8px}
.sub-body.exp{display:block}

/* Bar tooltip for change chart */
#barTooltip{position:absolute;display:none;background:#ffffff;border:1px solid var(--accent);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text);pointer-events:none;z-index:100;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,0.12);transform:translate(-50%,-100%);margin-top:-8px}
#barTooltip .strike{color:var(--accent);font-weight:700;margin-right:8px}
#barTooltip .cv{color:var(--red);margin-right:6px}
#barTooltip .pv{color:var(--green)}
.bar-rect{cursor:pointer;transition:opacity .12s}
.bar-rect:hover{opacity:0.65}

/* Trend charts */
.trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:12px}

/* Import overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.overlay.show{display:flex}
.overlay-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:500px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,0.15)}
.overlay-box h2{color:var(--accent);margin-bottom:12px;font-size:18px}
.overlay-box textarea{width:100%;height:200px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px;font-size:12px;font-family:monospace;resize:vertical}
.overlay-box .btn-row{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}

/* Confirm modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--red);border-radius:10px;padding:20px;max-width:400px;width:85%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.15)}
.modal-box p{margin-bottom:16px;font-size:14px;line-height:1.6}

/* Responsive */
@media(max-width:768px){
  body{padding:8px}
  .cards{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .charts-grouped{grid-template-columns:1fr}
  .trend-grid{grid-template-columns:1fr}
  .hdr h1{font-size:18px}
  .date-tab{padding:4px 8px;font-size:12px}
  .btn{padding:5px 10px;font-size:12px}
  table{font-size:11px}
  td,th{padding:4px 5px}
}
</style>
</head>
<body>
<div class="container">

<!-- Header -->
<div class="hdr">
  <h1>WTI 期权工作台</h1>
  <div class="hdr-right">
    <button class="btn" onclick="doExport()"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>导出JSON</button>
    <button class="btn" onclick="doImport()"><svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>导入数据</button>
    <button class="btn" style="border-color:var(--red);color:var(--red)" onclick="confirmClear()"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>清空</button>
  </div>
</div>

<!-- Alert -->
<div id="alertBox" class="alert"></div>

<!-- Date Nav -->
<div id="dateNav" class="date-nav"></div>

<!-- Contract Filter -->
<div class="filter-bar" id="filterBar">
  <span class="filter-label">合约筛选：</span>
  <label class="filter-chip" data-tag="2701"><input type="checkbox"><span class="dot" style="background:#8e44ad"></span><span>1月 CLF7</span></label>
  <label class="filter-chip" data-tag="2702"><input type="checkbox"><span class="dot" style="background:#d35400"></span><span>2月 CLG7</span></label>
  <label class="filter-chip" data-tag="2703"><input type="checkbox"><span class="dot" style="background:#00897b"></span><span>3月 CLH7</span></label>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="btn-mini" onclick="selectAllContracts()">全选</button>
    <button class="btn-mini" onclick="selectNoneContracts()">清空</button>
  </div>
</div>

<!-- Module 1: Daily Overview Cards -->
<div class="section">
  <div class="section-title">日度核心指标</div>
  <div id="cardsContainer" class="cards"></div>
</div>

<!-- Module 1.5: IV Smile Overlay (multi-contract) -->
<div class="section">
  <div class="section-title">IV 微笑（多合约对比，OTM 结构）</div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:8px">K &lt; Fwd 用 Put IV，K &gt; Fwd 用 Call IV；每条线代表一个合约的 OTM 偏斜</div>
  <div id="smileOverlayContainer"></div>
</div>

<!-- Module 2: Position Analysis -->
<div class="section">
  <div class="section-title">持仓分析</div>

  <!-- Collapsible OI detail tables (per month) -->
  <div class="sub-section">
    <div class="sub-section-header" onclick="toggleOiTable()">
      <span class="title"><span class="collapse-icon" id="oiTableIcon">▶</span> 各月份 OI 明细表</span>
      <span class="hint">点击展开/收起</span>
    </div>
    <div id="oiTableContainer" class="tbl-wrap sub-body" style="margin-bottom:16px"></div>
  </div>

  <div id="chartContainer" class="charts-grouped"></div>
</div>

<!-- Module 3: Trend Evolution -->
<div class="section">
  <div class="trend-header">
    <div class="section-title" style="flex:1;margin-bottom:0;border-bottom:none;padding-bottom:0">趋势演变</div>
    <div id="trendRangeBar" style="display:flex;gap:6px;align-items:center">
      <span style="font-size:12px;color:var(--muted);white-space:nowrap">日期范围：</span>
      <button class="btn-mini" data-days="30" onclick="setTrendRange(30,this)">1个月</button>
      <button class="btn-mini" data-days="60" onclick="setTrendRange(60,this)">2个月</button>
      <button class="btn-mini" data-days="90" onclick="setTrendRange(90,this)">3个月</button>
      <button class="btn-mini" data-days="0" onclick="setTrendRange(0,this)">全部</button>
    </div>
  </div>
  <div id="trendContainer" class="trend-grid"></div>
</div>

<!-- Trading Takeaways -->
<div class="section">
  <div class="section-title">交易要点</div>
  <div id="takeawayContainer" style="font-size:14px;line-height:1.8;color:var(--text)"></div>
</div>

</div>

<!-- Import overlay -->
<div id="importOverlay" class="overlay">
  <div class="overlay-box">
    <h2>导入数据</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:8px">粘贴每日 payload JSON，或拖入文件</p>
    <textarea id="importText" placeholder="粘贴 JSON 数据..."></textarea>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <div class="btn-row">
      <button class="btn" onclick="closeImport()">取消</button>
      <button class="btn" onclick="pickFile()">选文件</button>
      <button class="btn" style="background:var(--accent);color:#000;border-color:var(--accent)" onclick="applyImport()">导入</button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div id="confirmModal" class="modal">
  <div class="modal-box">
    <p id="confirmMsg"></p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn" onclick="closeConfirm()">取消</button>
      <button class="btn" id="confirmBtn" style="background:var(--red);color:#fff;border-color:var(--red)">确认</button>
    </div>
  </div>
</div>

<!-- Bar tooltip (absolutely positioned) -->
<div id="barTooltip"></div>

function loadData(){
  // Check version first - if mismatch, force refresh
  const storedVer = localStorage.getItem(STORAGE_KEY+'_ver') || '0';
  const stored = localStorage.getItem(STORAGE_KEY);
  let storedDays = [];
  if(stored && storedVer === String(DATA_VERSION)){
    try{ storedDays = JSON.parse(stored) || []; } catch(e){ storedDays = []; }
  }
  // 如果 localStorage 没有数据，或版本不匹配，则使用嵌入数据
  if(!storedDays.length){
    DAYS = INIT_DATA;
    saveData();
    return;
  }
  const storedLast = storedDays[storedDays.length-1]?.dateFull || '';
  const initLast = (INIT_DATA[INIT_DATA.length-1] || {}).dateFull || '';
  if(initLast && initLast > storedLast){
    // 嵌入数据更新过，用嵌入数据
    DAYS = INIT_DATA;
    saveData();
  } else {
    // 检查嵌入数据是否比缓存数据字段更丰富（如 deltaPc 回填）
    const initDeltaPcCount = INIT_DATA.reduce((s,d)=>{
      for(const t in d.contracts) if(d.contracts[t].deltaPc!=null) s++;
      return s;
    }, 0);
    const storedDeltaPcCount = storedDays.reduce((s,d)=>{
      for(const t in d.contracts) if(d.contracts[t].deltaPc!=null) s++;
      return s;
    }, 0);
    if(initDeltaPcCount > storedDeltaPcCount){
      DAYS = INIT_DATA;
      saveData();
    } else {
      DAYS = storedDays;
    }
  }
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DAYS)); localStorage.setItem(STORAGE_KEY+'_ver', String(DATA_VERSION)); }

// ── Contract Filter ──
function getActiveTags(allTags){
  return Array.from(allTags).filter(t=>ACTIVE_TAGS.has(t));
}
function saveFilter(){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify(Array.from(ACTIVE_TAGS))); }catch(e){}
}
function loadFilter(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(FILTER_KEY)); }catch(e){}
  if(!saved || !Array.isArray(saved) || !saved.length){
    // 默认全选
    return new Set(Object.keys(META));
  }
  // 过滤掉 META 中不存在的 tag
  return new Set(saved.filter(t=>META[t]));
}
function setupContractFilter(){
  // 同步 UI
  const chips = document.querySelectorAll('.filter-chip');
  chips.forEach(chip=>{
    const tag = chip.dataset.tag;
    const cb = chip.querySelector('input');
    if(ACTIVE_TAGS.has(tag)){ cb.checked = true; chip.classList.remove('off'); }
    else{ cb.checked = false; chip.classList.add('off'); }
    // 点击 chip 任意位置都切换
    chip.addEventListener('click', (e)=>{
      if(e.target.tagName === 'INPUT'){
        toggleTag(tag, cb.checked);
      } else {
        // 标签/文字被点击时手动翻转
        cb.checked = !cb.checked;
        toggleTag(tag, cb.checked);
      }
    });
  });
}
function toggleTag(tag, on){
  if(on) ACTIVE_TAGS.add(tag); else ACTIVE_TAGS.delete(tag);
  const chip = document.querySelector('.filter-chip[data-tag="'+tag+'"]');
  if(chip){
    chip.classList.toggle('off', !on);
    const cb = chip.querySelector('input');
    if(cb) cb.checked = on;
  }
  saveFilter();
  renderAll();
}
function selectAllContracts(){
  ACTIVE_TAGS = new Set(Object.keys(META));
  saveFilter();
  document.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.querySelector('input').checked = true;
    chip.classList.remove('off');
  });
  renderAll();
}
function selectNoneContracts(){
  ACTIVE_TAGS = new Set();
  saveFilter();
  document.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.querySelector('input').checked = false;
    chip.classList.add('off');
  });
  renderAll();
}

// ── Helpers ──
function num(v,d){ return v!=null ? v.toFixed(d||2) : '-'; }
function signed(v,d){
  if(v==null||v===0) return '(0)';
  const s = v>0?'+':'';
  return d!=null ? s+v.toFixed(d) : s+v.toLocaleString('zh-CN');
}
function clr(v){ return v>0?'up':v<0?'down':''; }
function pct(v){ return v!=null ? v.toFixed(1)+'%' : '-'; }
function contractLabel(tag){ return META[tag] ? META[tag].label+' '+META[tag].code : tag; }
function contractColor(tag){ return META[tag] ? META[tag].color : '#888'; }

// ── Render Date Nav ──
function renderNav(){
  const nav = document.getElementById('dateNav');
  nav.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const tab = document.createElement('div');
    tab.className = 'date-tab'+(i===selectedIdx?' active':'');
    tab.textContent = d.date;
    tab.onclick = ()=>{ selectedIdx=i; renderAll(); };
    nav.appendChild(tab);
  });
}

// ── Alert Box ──
function renderAlert(){
  const box = document.getElementById('alertBox');
  if(!DAYS.length){ box.style.display='none'; return; }
  const day = DAYS[selectedIdx];
  let alerts = [];
  for(const tag in day.contracts){
    const c = day.contracts[tag];
    if(c.dte!=null && c.dte<=5) alerts.push('<b>'+contractLabel(tag)+'</b> 仅剩 <b>'+c.dte+'天</b> 到期！');
    if(c.interCallChg && Math.abs(c.interCallChg)>10000) alerts.push(contractLabel(tag)+' Call 变动 <b>'+signed(c.interCallChg)+'</b>');
    if(c.interPutChg && Math.abs(c.interPutChg)>10000) alerts.push(contractLabel(tag)+' Put 变动 <b>'+signed(c.interPutChg)+'</b>');
  }
  if(!alerts.length){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = alerts.join(' &nbsp;|&nbsp; ');
}

// ── Module 2: OI Table ──
function renderOiTable(){

  for(const tag of tags){

    html += '<table><thead><tr><th>行权价</th><th style="color:#c0392b">Call OI</th><th style="color:#c0392b">变动</th><th style="color:#2c7c4f">Put OI</th><th style="color:#2c7c4f">变动</th></tr></thead><tbody>';
    for(let i=0;i<n;i++){
      const k = c.strikes[i];
      const co = c.cOi[i], po = c.pOi[i], cc = c.cChg[i], pc = c.pChg[i];
      const ks = k%1===0 ? k.toFixed(0) : k.toFixed(1);
      const isAtm = Math.abs(k-c.fwd) < 1.5;
      const rowStyle = isAtm ? 'background:rgba(212,137,10,0.10)' : '';
      html += '<tr style="'+rowStyle+'"><td><b>'+ks+'</b>'+(isAtm?' ★':'')+'</td>';

    html += '</tbody></table>';
  }
  cont.innerHTML = html;

// ── SVG Chart Helpers ──
function svgOpen(w,h){ return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" style="font-family:inherit">'; }
const svgClose = '</svg>';

function svgLineChart(series, w, h, opts={}){
  // series: [{tag, label, color, data:[{x label, y value}]}]
  const pad = {l:50,r:15,t:20,b:44};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  let allY = [];
  series.forEach(s=>s.data.forEach(d=>{ if(d.y!=null) allY.push(d.y); }));
  if(!allY.length) return svgOpen(w,h)+'<text x="'+w/2+'" y="'+h/2+'" fill="#5c6370" text-anchor="middle" font-size="12">无数据</text>'+svgClose;
  const yMin = opts.yMin!=null ? opts.yMin : Math.min(...allY);
  const yMax = opts.yMax!=null ? opts.yMax : Math.max(...allY);
  const yRange = Math.max(yMax-yMin, 0.01);
  const xCount = series[0].data.length;
  const xStep = xCount>1 ? cw/(xCount-1) : cw;
  function xP(i){ return pad.l + i*xStep; }
  function yP(v){ return pad.t + ch - ((v-yMin)/yRange)*ch; }

  let svg = svgOpen(w,h);
  // Grid
  const yTicks = 5;
  for(let i=0;i<=yTicks;i++){
    const v = yMin + (yRange/yTicks)*i;
    const y = yP(v);
    svg += '<line x1="'+pad.l+'" y1="'+y+'" x2="'+w-pad.r+'" y2="'+y+'" stroke="#e1e4ea" stroke-width="0.5"/>';
    svg += '<text x="'+(pad.l-4)+'" y="'+(y+4)+'" fill="#5c6370" text-anchor="end" font-size="10">'+(opts.currency?'$':'')+v.toFixed(opts.decimal||0)+(opts.suffix||'')+'</text>';
  }
  // X labels（均匀采样最多 ~10 个，斜排防重叠）
  const lblStep = Math.max(1, Math.ceil(xCount/10));
  for(let i=0;i<xCount;i++){
    if(i%lblStep!==0 && i!==xCount-1) continue;
    const lx = xP(i), ly = h-8;
    svg += '<text x="'+lx+'" y="'+ly+'" fill="#5c6370" text-anchor="end" font-size="10" transform="rotate(-38 '+lx+' '+ly+')">'+series[0].data[i].x+'</text>';
  }
  // Lines
  series.forEach(s=>{
    let pts = '';
    for(let i=0;i<s.data.length;i++){
      if(s.data[i].y==null) continue;
      pts += xP(i)+','+yP(s.data[i].y)+' ';
    }
    if(pts){
      svg += '<polyline points="'+pts.trim()+'" fill="none" stroke="'+s.color+'" stroke-width="2"/>';
      // Dots
      for(let i=0;i<s.data.length;i++){
        if(s.data[i].y==null) continue;
        svg += '<circle cx="'+xP(i)+'" cy="'+yP(s.data[i].y)+'" r="3.5" fill="'+s.color+'"/>';
      }
    }
  });
  // Legend
  let lx = pad.l;
  series.forEach(s=>{
    svg += '<rect x="'+lx+'" y="3" width="10" height="10" fill="'+s.color+'" rx="2"/>';
    svg += '<text x="'+(lx+14)+'" y="12" fill="#1a1f2e" font-size="10">'+s.label+'</text>';
    lx += 14 + s.label.length*9 + 10;
  });
  svg += svgClose;
  return svg;
}

function svgBarChart(strikes, cOi, pOi, fwd, mp, w, h){
  const pad = {l:40,r:10,t:25,b:28};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  const n = strikes.length;
  if(!n) return svgOpen(w,h)+'<text fill="#5c6370" text-anchor="middle" x="'+w/2+'" y="'+h/2+'" font-size="12">无数据</text>'+svgClose;
  const barW = Math.max(cw/n*0.38, 2);
  const gap = cw/n;
  let maxOi = 1;
  for(let i=0;i<n;i++){ maxOi = Math.max(maxOi, Math.abs(cOi[i]), Math.abs(pOi[i])); }
  function yP(v){ return pad.t + ch - (Math.abs(v)/maxOi)*ch*0.9; }

  let svg = svgOpen(w,h);
  // Zero line
  const zeroY = pad.t + ch;
  svg += '<line x1="'+pad.l+'" y1="'+zeroY+'" x2="'+(w-pad.r)+'" y2="'+zeroY+'" stroke="#7a7d8a" stroke-width="1"/>';
  // Bars
  for(let i=0;i<n;i++){
    const k = strikes[i];
    const x = pad.l + i*gap + gap*0.1;
    if(cOi[i]>0){
      const bh = (cOi[i]/maxOi)*ch*0.9;
      svg += '<rect class="bar-rect" data-strike="'+k+'" data-call="'+cOi[i]+'" data-put="0" data-mode="oi" x="'+x+'" y="'+(zeroY-bh)+'" width="'+barW+'" height="'+bh+'" fill="#c0392b" rx="1"/>';
    }
    if(pOi[i]>0){
      const bh = (pOi[i]/maxOi)*ch*0.9;
      svg += '<rect class="bar-rect" data-strike="'+k+'" data-call="0" data-put="'+pOi[i]+'" data-mode="oi" x="'+(x+barW+1)+'" y="'+(zeroY-bh)+'" width="'+barW+'" height="'+bh+'" fill="#2c7c4f" rx="1"/>';
    }
  }
  // Fwd line
  if(fwd!=null){
    for(let i=0;i<n-1;i++){
      if(strikes[i]<=fwd && strikes[i+1]>=fwd){
        const frac = (fwd-strikes[i])/(strikes[i+1]-strikes[i]);
        const x = pad.l + (i+frac)*gap;
        svg += '<line x1="'+x+'" y1="'+pad.t+'" x2="'+x+'" y2="'+(pad.t+ch)+'" stroke="#d4890a" stroke-width="1.5" stroke-dasharray="4,3"/>';
        svg += '<text x="'+x+'" y="'+(pad.t-4)+'" fill="#d4890a" text-anchor="middle" font-size="9">Fwd</text>';
        break;
      }
    }
  }
  // MP line
  if(mp!=null){
    for(let i=0;i<n-1;i++){
      if(strikes[i]<=mp && strikes[i+1]>=mp){
        const frac = (mp-strikes[i])/(strikes[i+1]-strikes[i]);
        const x = pad.l + (i+frac)*gap;
        svg += '<line x1="'+x+'" y1="'+pad.t+'" x2="'+x+'" y2="'+(pad.t+ch)+'" stroke="#5c6370" stroke-width="1" stroke-dasharray="2,3"/>';
        svg += '<text x="'+x+'" y="'+(pad.t+ch+14)+'" fill="#5c6370" text-anchor="middle" font-size="9">MP</text>';
        break;
      }
    }
  }
  // X labels (sparse)
  const step = Math.max(1, Math.floor(n/12));
  for(let i=0;i<n;i+=step){
    const x = pad.l + i*gap + gap*0.5;
    const k = strikes[i]%1===0 ? strikes[i].toFixed(0) : strikes[i].toFixed(1);
    svg += '<text x="'+x+'" y="'+(h-5)+'" fill="#5c6370" text-anchor="middle" font-size="9">'+k+'</text>';
  }
  // Y labels
  const yTicks = 4;
  for(let i=0;i<=yTicks;i++){
    const v = (maxOi/yTicks)*i;
    const y = pad.t+ch - (v/maxOi)*ch*0.9;
    svg += '<text x="'+(pad.l-3)+'" y="'+(y+3)+'" fill="#5c6370" text-anchor="end" font-size="9">'+(v/1000).toFixed(0)+'k</text>';
  }
  // Legend
  svg += '<rect x="'+(w-120)+'" y="2" width="8" height="8" fill="#c0392b" rx="1"/><text x="'+(w-108)+'" y="10" fill="#1a1f2e" font-size="9">Call</text>';
  svg += '<rect x="'+(w-70)+'" y="2" width="8" height="8" fill="#2c7c4f" rx="1"/><text x="'+(w-58)+'" y="10" fill="#1a1f2e" font-size="9">Put</text>';
  svg += svgClose;
  return svg;
}

function svgChangeChart(strikes, cChg, pChg, w, h){
  const pad = {l:45,r:10,t:25,b:28};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  const n = strikes.length;
  if(!n) return '';
  const barW = Math.max(cw/n*0.38, 2);
  const gap = cw/n;
  let maxAbs = 1;
  for(let i=0;i<n;i++){ maxAbs = Math.max(maxAbs, Math.abs(cChg[i]), Math.abs(pChg[i])); }
  const midY = pad.t + ch/2;
  function yP(v){ return midY - (v/maxAbs)*(ch/2)*0.9; }

  let svg = svgOpen(w,h);
  // Zero line
  svg += '<line x1="'+pad.l+'" y1="'+midY+'" x2="'+(w-pad.r)+'" y2="'+midY+'" stroke="#5c6370" stroke-width="1"/>';
  // Bars (with data attrs for tooltip)
  for(let i=0;i<n;i++){
    const x = pad.l + i*gap + gap*0.1;
    const k = strikes[i];
    if(cChg[i]!==0){
      const y0 = midY, y1 = yP(cChg[i]);
      const yT = Math.min(y0,y1), bh = Math.abs(y1-y0);
      svg += '<rect class="bar-rect" data-strike="'+k+'" data-call="'+cChg[i]+'" data-put="0" data-mode="chg" x="'+x+'" y="'+yT+'" width="'+barW+'" height="'+Math.max(bh,1)+'" fill="#c0392b" rx="1"/>';
    }
    if(pChg[i]!==0){
      const y0 = midY, y1 = yP(pChg[i]);
      const yT = Math.min(y0,y1), bh = Math.abs(y1-y0);
      svg += '<rect class="bar-rect" data-strike="'+k+'" data-call="0" data-put="'+pChg[i]+'" data-mode="chg" x="'+(x+barW+1)+'" y="'+yT+'" width="'+barW+'" height="'+Math.max(bh,1)+'" fill="#2c7c4f" rx="1"/>';
    }
  }
  // X labels
  const step = Math.max(1, Math.floor(n/12));
  for(let i=0;i<n;i+=step){
    const x = pad.l + i*gap + gap*0.5;
    const k = strikes[i]%1===0 ? strikes[i].toFixed(0) : strikes[i].toFixed(1);
    svg += '<text x="'+x+'" y="'+(h-5)+'" fill="#5c6370" text-anchor="middle" font-size="9">'+k+'</text>';
  }
  // Y labels
  svg += '<text x="'+(pad.l-3)+'" y="'+(midY+3)+'" fill="#5c6370" text-anchor="end" font-size="9">0</text>';
  const yt = 3;
  for(let i=1;i<=yt;i++){
    const v = (maxAbs/yt)*i;
    svg += '<text x="'+(pad.l-3)+'" y="'+(yP(v)+3)+'" fill="#5c6370" text-anchor="end" font-size="9">'+(v/1000).toFixed(1)+'k</text>';
    svg += '<text x="'+(pad.l-3)+'" y="'+(yP(-v)+3)+'" fill="#5c6370" text-anchor="end" font-size="9">'+(-v/1000).toFixed(1)+'k</text>';
  }
  // Legend
  svg += '<rect x="'+(w-120)+'" y="2" width="8" height="8" fill="#c0392b" rx="1"/><text x="'+(w-108)+'" y="10" fill="#1a1f2e" font-size="9">Call</text>';
  svg += '<rect x="'+(w-70)+'" y="2" width="8" height="8" fill="#2c7c4f" rx="1"/><text x="'+(w-58)+'" y="10" fill="#1a1f2e" font-size="9">Put</text>';
  svg += svgClose;
  return svg;
}

// Multi-contract IV smile overlay (OTM-combined per contract, multiple lines on one chart)
function svgSmileOverlayChart(series, w, h){
  // series: [{tag, label, color, smile:[{x,y}], fwd, dte}]
  const pad = {l:50,r:15,t:25,b:32};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  // Collect all x/y
  let allX = [], allY = [];
  series.forEach(s=>{
    s.smile.forEach(p=>{ allX.push(p.x); allY.push(p.y); });
  });
  if(!allX.length || !allY.length) return svgOpen(w,h)+'<text x="'+w/2+'" y="'+h/2+'" fill="#5c6370" text-anchor="middle" font-size="12">无 IV 微笑数据</text>'+svgClose;
  const xMin = Math.min(...allX), xMax = Math.max(...allX);
  const xRange = Math.max(xMax-xMin, 1);
  const yMin = Math.min(...allY), yMax = Math.max(...allY);
  const yRange = Math.max(yMax-yMin, 1);
  function xP(x){ return pad.l + ((x-xMin)/xRange)*cw; }
  function yP(y){ return pad.t + ch - ((y-yMin)/yRange)*ch*0.9; }

  let svg = svgOpen(w,h);
  // Grid + Y labels
  for(let i=0;i<=5;i++){
    const v = yMin + (yRange/5)*i;
    const y = yP(v);
    svg += '<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="#e1e4ea" stroke-width="0.5"/>';
    svg += '<text x="'+(pad.l-4)+'" y="'+(y+4)+'" fill="#5c6370" text-anchor="end" font-size="10">'+v.toFixed(1)+'%</text>';
  }
  // X labels (sparse)
  const xTicks = 8;
  for(let i=0;i<=xTicks;i++){
    const x = xMin + (xRange/xTicks)*i;
    svg += '<text x="'+xP(x)+'" y="'+(h-12)+'" fill="#5c6370" text-anchor="middle" font-size="10">$'+x.toFixed(0)+'</text>';
  }
  // Lines + dots (hover-able with native title for tooltip)
  series.forEach(s=>{
    if(!s.smile || s.smile.length<2) return;
    let pts = '';
    s.smile.forEach(p=>{ pts += xP(p.x)+','+yP(p.y)+' '; });
    svg += '<polyline points="'+pts.trim()+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round"/>';
    s.smile.forEach(p=>{
      svg += '<circle cx="'+xP(p.x)+'" cy="'+yP(p.y)+'" r="2.5" fill="'+s.color+'" fill-opacity="0.85"><title>'+s.label+' · K $'+p.x.toFixed(2)+' · IV '+p.y.toFixed(1)+'%</title></circle>';
    });
    // Forward line for each contract
    if(s.fwd!=null && s.fwd>=xMin && s.fwd<=xMax){
      const x = xP(s.fwd);
      svg += '<line x1="'+x+'" y1="'+pad.t+'" x2="'+x+'" y2="'+(pad.t+ch)+'" stroke="'+s.color+'" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>';
    }
  });
  // Legend
  let lx = pad.l;
  series.forEach(s=>{
    svg += '<rect x="'+lx+'" y="3" width="10" height="10" fill="'+s.color+'" rx="2"/>';
    svg += '<text x="'+(lx+14)+'" y="12" fill="#1a1f2e" font-size="10">'+s.label+'</text>';
    lx += 14 + s.label.length*9 + 10;
  });
  // X axis label
  svg += '<text x="'+((pad.l+w-pad.r)/2)+'" y="'+h+'" fill="#5c6370" text-anchor="middle" font-size="10">行权价 ($/bbl)</text>';
  svg += svgClose;
  return svg;
}

  // Attach tooltip handlers to all .bar-rect (after DOM is in place)
  attachBarTooltip(cont);
}

function toggleMonthBody(headerEl){
  const icon = headerEl.querySelector('.collapse-icon');
  // Find next sibling .month-body
  let next = headerEl.nextElementSibling;
  // Skip to first .month-body after this header
  while(next && !next.classList.contains('month-body')) next = next.nextElementSibling;
  if(!next) return;
  const isOpen = next.classList.toggle('exp');
  next.style.display = isOpen ? 'block' : 'none';
  icon.classList.toggle('exp', isOpen);
}

function toggleOiTable(){
  const cont = document.getElementById('oiTableContainer');
  const icon = document.getElementById('oiTableIcon');
  const isOpen = cont.classList.toggle('exp');
  cont.style.display = isOpen ? 'block' : 'none';
  if(icon) icon.classList.toggle('exp', isOpen);
  persistOiState();
}

function persistOiState(){

function attachBarTooltip(rootEl){
  const tooltip = document.getElementById('barTooltip');
  if(!tooltip) return;
  const containerEl = document.querySelector('.container');
  const bars = rootEl.querySelectorAll('.bar-rect');
  bars.forEach(r=>{
    const showTip = (e)=>{
      e.stopPropagation();
      const k = parseFloat(r.dataset.strike);
      const cVal = parseInt(r.dataset.call);
      const pVal = parseInt(r.dataset.put);
      const mode = r.dataset.mode || 'chg';
      const ks = (k%1===0) ? k.toFixed(0) : k.toFixed(1);
      let html = '<span class="strike">Strike '+ks+'</span>';
      if(cVal !== 0){
        if(mode === 'oi'){
          html += '<span class="cv">Call OI '+cVal.toLocaleString()+'</span>';
        } else {
          html += '<span class="cv">Call '+(cVal>0?'+':'')+cVal.toLocaleString()+'</span>';
        }
      }
      if(pVal !== 0){
        if(mode === 'oi'){
          html += '<span class="pv">Put OI '+pVal.toLocaleString()+'</span>';
        } else {
          html += '<span class="pv">Put '+(pVal>0?'+':'')+pVal.toLocaleString()+'</span>';
        }
      }
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';

      const rRect = r.getBoundingClientRect();
      const cRect = containerEl.getBoundingClientRect();
      let left = rRect.left - cRect.left + rRect.width/2;
      let top = rRect.top - cRect.top;
      // Adjust if tooltip would go above container
      const tipH = tooltip.offsetHeight || 40;
      if(top < tipH + 8) top = rRect.bottom - cRect.top + 8;
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    };
    const hideTip = ()=>{ tooltip.style.display = 'none'; };

    r.addEventListener('mouseenter', showTip);
    r.addEventListener('mouseleave', hideTip);
    r.addEventListener('touchstart', showTip, {passive:true});
    // Title fallback for browsers that show native tooltip on hold
    const kf = parseFloat(r.dataset.strike);
    const tipK = (kf%1===0) ? kf.toFixed(0) : kf.toFixed(1);
    const mode = r.dataset.mode || 'chg';
    const cV = parseInt(r.dataset.call);
    const pV = parseInt(r.dataset.put);
    let titleText = 'Strike '+tipK+' • ';
    if(cV!==0) titleText += (mode==='oi'?'Call OI ':'Call ')+(cV>0&&mode==='chg'?'+':'')+r.dataset.call+' ';
    if(pV!==0) titleText += (mode==='oi'?'Put OI ':'Put ')+(pV>0&&mode==='chg'?'+':'')+r.dataset.put;
    r.setAttribute('title', titleText.trim());
  });
  // Hide on tap outside (use one delegated listener)
  if(!attachBarTooltip._installed){
    attachBarTooltip._installed = true;
    document.addEventListener('touchstart', (e)=>{
      if(!e.target.classList.contains('bar-rect')) tooltip.style.display = 'none';
    }, {passive:true});
    document.addEventListener('click', (e)=>{
      if(!e.target.classList.contains('bar-rect')) tooltip.style.display = 'none';
    });
  }
}

// ── Module 3: Trend Charts ──
// 日期范围（用户 2026-10-13 要求：右上角可调节日期范围按钮；默认最近 30 天）
let TREND_RANGE_DAYS = 30;
function trendDaysFiltered(){
  if(!TREND_RANGE_DAYS || !DAYS.length) return DAYS;
  const last = DAYS[DAYS.length-1].dateFull;
  if(!last) return DAYS;
  const dt = new Date(last);
  dt.setDate(dt.getDate() - TREND_RANGE_DAYS);
  const cutoff = dt.toISOString().slice(0,10);
  const f = DAYS.filter(d=>!d.dateFull || d.dateFull >= cutoff);
  return f.length ? f : DAYS;
}
function setTrendRange(days, btn){
  TREND_RANGE_DAYS = days;
  try{ localStorage.setItem('wb_wti_trend_range', String(days)); }catch(e){}
  document.querySelectorAll('#trendRangeBar .btn-mini').forEach(b=>b.classList.toggle('active', b.dataset.days===String(days)));
  renderTrends();
}
function initTrendRange(){
  let saved = NaN;
  try{ saved = parseInt(localStorage.getItem('wb_wti_trend_range')); }catch(e){}
  if([0,30,60,90].includes(saved)) TREND_RANGE_DAYS = saved;
  document.querySelectorAll('#trendRangeBar .btn-mini').forEach(b=>b.classList.toggle('active', b.dataset.days===String(TREND_RANGE_DAYS)));
}

function buildTrendSeries(field, decimal){
  // Get all unique tags across days
  const days = trendDaysFiltered();
  const allTags = new Set();
  days.forEach(d=>Object.keys(d.contracts).forEach(t=>allTags.add(t)));
  const series = [];
  allTags.forEach(tag=>{
    if(!ACTIVE_TAGS.has(tag)) return;  // 过滤未选中的合约
    const s = {tag, label:contractLabel(tag), color:contractColor(tag), data:[]};
    days.forEach(d=>{
      const c = d.contracts[tag];
      s.data.push({x:d.date, y:c&&c[field]!=null?c[field]:null});
    });
    series.push(s);
  });
  return series;
}

function renderTrends(){
  const cont = document.getElementById('trendContainer');
  const fields = [
    {key:'fwd', label:'期货价格', currency:true, decimal:2},
    {key:'pc', label:'P/C 比率', currency:false, decimal:3},
    {key:'atmIv', label:'ATM IV', currency:false, decimal:1, suffix:'%'},
    {key:'deltaPc', label:'Δ加权P/C', currency:false, decimal:3},
    {key:'rr', label:'25Δ RR', currency:false, decimal:1, suffix:'pts'},
    {key:'mp', label:'Max Pain', currency:true, decimal:1},
    {key:'delta', label:'净 Delta', currency:false, decimal:0},
    {key:'gamma', label:'净 Gamma', currency:false, decimal:0},
    {key:'vega', label:'净 Vega', currency:false, decimal:0},
  ];
  let html = '';
  fields.forEach(f=>{
    const series = buildTrendSeries(f.key, f.decimal);
    html += '<div class="chart-box"><h3>'+f.label+(f.suffix?' ('+f.suffix+')':'')+' 走势</h3>';
    html += svgLineChart(series, 400, 200, {currency:f.currency, decimal:f.decimal, suffix:f.suffix||''});
    html += '</div>';
  });
  cont.innerHTML = html;
}

// ── Trading Takeaways ──
function renderTakeaways(){
  const cont = document.getElementById('takeawayContainer');
  const day = DAYS[selectedIdx];
  const tags = getActiveTags(Object.keys(day.contracts));
  if(!tags.length){
    cont.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:12px;text-align:center">无选中合约</div>';
    return;
  }
  let lines = [];
  // Find biggest changes
  for(const tag of tags){
    const c = day.contracts[tag];
    if(c.interCallChg!=null && Math.abs(c.interCallChg)>5000){
      const dir = c.interCallChg>0?'增仓':'减仓';
      lines.push('<b style="color:'+contractColor(tag)+'">'+contractLabel(tag)+'</b> Call '+dir+' <b style="color:var(--red)">'+signed(c.interCallChg)+'</b>');
    }
    if(c.interPutChg!=null && Math.abs(c.interPutChg)>5000){
      const dir = c.interPutChg>0?'增仓':'减仓';
      lines.push('<b style="color:'+contractColor(tag)+'">'+contractLabel(tag)+'</b> Put '+dir+' <b style="color:var(--green)">'+signed(c.interPutChg)+'</b>');
    }
  }
  // Find biggest strike changes
  for(const tag of tags){
    const c = day.contracts[tag];
    let bigC=[], bigP=[];
    for(let i=0;i<c.strikes.length;i++){
      if(Math.abs(c.cChg[i])>3000) bigC.push([c.strikes[i],c.cChg[i]]);
      if(Math.abs(c.pChg[i])>3000) bigP.push([c.strikes[i],c.pChg[i]]);
    }
    if(bigC.length){
      bigC.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
      const top = bigC.slice(0,3).map(x=>'C'+x[0].toFixed(0)+' '+signed(x[1])).join(' / ');
      lines.push('<b style="color:'+contractColor(tag)+'">'+contractLabel(tag)+'</b> 大额Call变动: '+top);
    }
    if(bigP.length){
      bigP.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
      const top = bigP.slice(0,3).map(x=>'P'+x[0].toFixed(0)+' '+signed(x[1])).join(' / ');
      lines.push('<b style="color:'+contractColor(tag)+'">'+contractLabel(tag)+'</b> 大额Put变动: '+top);
    }
  }
  // P/C direction
  for(const tag of tags){
    const c = day.contracts[tag];
    if(c.pcChg!=null && Math.abs(c.pcChg)>0.05){
      const dir = c.pcChg>0 ? 'Put防护增强' : 'Call偏好升温';
      lines.push('<b style="color:'+contractColor(tag)+'">'+contractLabel(tag)+'</b> P/C '+c.pc.toFixed(3)+' ('+signed(c.pcChg,3)+') → '+dir);
    }
  }
  // Delta
  for(const tag of tags){
    const c = day.contracts[tag];
    if(c.delta!=null){
      const dir = c.delta>0?'净多头':'净空头';
      lines.push('<b style="color:'+contractColor(tag)+'">'+contractLabel(tag)+'</b> 净Delta '+signed(c.delta)+' ('+dir+')');
    }
  }
  if(!lines.length) lines.push('暂无显著信号');
  cont.innerHTML = lines.map(l=>'<div>• '+l+'</div>').join('');
}

// ── Import / Export ──
function doExport(){
  const data = JSON.stringify(DAYS, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'wti期权工作台_备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}

function doImport(){
  document.getElementById('importText').value = '';
  document.getElementById('importOverlay').classList.add('show');
}
function closeImport(){ document.getElementById('importOverlay').classList.remove('show'); }
function pickFile(){
  const inp = document.getElementById('importFile');
  inp.onchange = ()=>{
    const file = inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ document.getElementById('importText').value = reader.result; };
    reader.readAsText(file);
  };
  inp.click();
}

function applyImport(){
  const text = document.getElementById('importText').value.trim();
  if(!text){ alert('请粘贴或选择JSON数据'); return; }
  try{
    const obj = JSON.parse(text);
    // Could be a single payload or array of days
    if(Array.isArray(obj)){
      // Array of day objects - merge
      obj.forEach(newDay=>{
        const idx = DAYS.findIndex(d=>d.date===newDay.date);
        if(idx>=0) DAYS[idx] = newDay;
        else DAYS.push(newDay);
      });
    } else if(obj.summary && obj.oi_data){
      // Single payload from skill-2 - convert
      const day = {date: obj.date||'??', dateFull: obj.dateFull||'', contracts:{}};
      for(const tag in obj.summary){
        const s = obj.summary[tag], od = obj.oi_data[tag];
        day.contracts[tag] = {
          code: s.code||tag, fwd:s.fwd, oldFwd:s.old_fwd,
          atmIv:s.atm_iv, oldIv:s.old_iv,
          mp:s.mp, mpChg:s.mp_chg||0, dte:s.dte,
          pc:s.inter_pc_new, pcChg:s.inter_pc_chg,
          deltaPc:s.inter_delta_pc_new, deltaPcChg:s.inter_delta_pc_chg,
          rr:s.rr, bf:s.bf,
          delta:s.tot_delta, gamma:s.tot_gamma, vega:s.tot_vega,
          totalC:s.total_c, totalP:s.total_p,
          interCallChg:s.inter_call_chg, interPutChg:s.inter_put_chg,
          strikes:od.strikes, cOi:od.c_oi, pOi:od.p_oi,
          cChg:od.c_chg, pChg:od.p_chg,
          smile:(obj.smiles && obj.smiles[tag]) || [],
        };
      }
      // Try to infer date from filename
      const idx = DAYS.findIndex(d=>d.date===day.date);
      if(idx>=0) DAYS[idx]=day; else DAYS.push(day);
      DAYS.sort((a,b)=>a.dateFull.localeCompare(b.dateFull));
    } else {
      alert('无法识别数据格式，请粘贴 skill-2 生成的 payload JSON');
      return;
    }
    saveData();
    selectedIdx = DAYS.length-1;
    closeImport();
    renderAll();
  }catch(e){
    alert('JSON 解析失败: '+e.message);
  }
}

function confirmClear(){
  document.getElementById('confirmMsg').innerHTML = '<b style="color:var(--red)">⚠ 确认清空所有数据？</b><br>此操作不可恢复，建议先导出备份。';
  document.getElementById('confirmBtn').onclick = ()=>{
    DAYS = [];
    saveData();
    closeConfirm();
    renderAll();
  };
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm(){ document.getElementById('confirmModal').classList.remove('show'); }

// ── Master Render ──
function renderAll(){
  if(!DAYS.length){
    document.getElementById('alertBox').style.display='none';
    document.getElementById('dateNav').innerHTML='<div style="color:var(--muted);font-size:14px">暂无数据，请导入 payload JSON</div>';
    document.getElementById('cardsContainer').innerHTML='';
    document.getElementById('smileOverlayContainer').innerHTML='';
    document.getElementById('oiTableContainer').innerHTML='';
    document.getElementById('oiTableContainer').style.display='none';
    document.getElementById('chartContainer').innerHTML='';
    document.getElementById('trendContainer').innerHTML='';
    document.getElementById('takeawayContainer').innerHTML='';
    return;
  }
  if(selectedIdx>=DAYS.length) selectedIdx=DAYS.length-1;
  renderNav();
  renderAlert();
  renderCards();
  renderSmileOverlay();
  renderOiTable();
  // Apply saved OI table expansion state
  const oiCont = document.getElementById('oiTableContainer');
  const oiIcon = document.getElementById('oiTableIcon');
  if(oiCont){
    const shouldShow = getOiOpen();
    oiCont.classList.toggle('exp', shouldShow);
    oiCont.style.display = shouldShow ? 'block' : 'none';
    if(oiIcon) oiIcon.classList.toggle('exp', shouldShow);
  }
  renderCharts();
  renderTrends();
  renderTakeaways();
}

// ── Init ──
loadData();
ACTIVE_TAGS = loadFilter();
setupContractFilter();
initTrendRange();
renderAll();
</script>
